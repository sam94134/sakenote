<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日系手繪筆記 · Handwritten Note Generator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@400;700&family=Noto+Serif+JP:wght@300;400;700&family=Ma+Shan+Zheng&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--cream:#f7f3ec;--aged:#ede8dc;--ink:#1a1410;--sepia:#8b6f47;--warm:#c4956a;--accent:#8b2020}
body{background:var(--cream);font-family:'Noto Serif JP',serif;min-height:100vh;color:var(--ink)}
.app{max-width:820px;margin:0 auto;padding:2.5rem 1.5rem 5rem}

.header{text-align:center;margin-bottom:2.4rem}
.header h1{font-family:'Kaisei Decol',serif;font-size:2.1rem;font-weight:700;letter-spacing:.25em}
.header h1::after{content:'';display:block;width:38%;height:1px;background:rgba(26,20,16,.15);margin:.45rem auto 0}
.header p{font-size:.74rem;letter-spacing:.2em;color:var(--sepia);margin-top:.45rem}

/* ── API Key section ── */
.key-section{
  background:var(--aged);
  border:1px solid rgba(196,149,106,.4);
  border-radius:6px;padding:1.2rem 1.5rem;
  margin-bottom:1.8rem;
}
.key-section h3{
  font-size:.68rem;letter-spacing:.2em;color:var(--sepia);
  text-transform:uppercase;margin-bottom:.8rem;
  display:flex;align-items:center;gap:.5rem;
}
.key-row{display:flex;gap:.6rem;align-items:center}
.key-row input{
  flex:1;border:none;border-bottom:1.5px solid rgba(196,149,106,.55);
  background:transparent;padding:.32rem .1rem;
  font-size:.88rem;font-family:monospace;color:var(--ink);
  outline:none;letter-spacing:.04em;min-width:0;
}
.key-row input:focus{border-bottom-color:var(--warm)}
.key-row input::placeholder{color:rgba(139,111,71,.5);font-size:.82rem;letter-spacing:0}
.key-save-btn{
  background:var(--ink);color:var(--cream);border:none;
  padding:.38rem .9rem;font-family:'Noto Serif JP',serif;
  font-size:.76rem;letter-spacing:.08em;cursor:pointer;
  border-radius:2px;white-space:nowrap;flex-shrink:0;
  transition:opacity .2s;
}
.key-save-btn:hover{opacity:.75}
.key-status{
  font-size:.74rem;margin-top:.5rem;padding:.25rem .6rem;
  border-radius:3px;display:inline-block;
}
.key-status.ok{background:rgba(58,107,42,.12);color:#3a6b2a}
.key-status.err{background:rgba(139,32,32,.1);color:var(--accent)}
.key-status.empty{color:var(--sepia)}
.key-hint{font-size:.7rem;color:#b09a7e;margin-top:.4rem;line-height:1.55}
.key-hint a{color:var(--warm);text-decoration:none}
.key-hint a:hover{text-decoration:underline}

/* ── Upload ── */
.upload-zone{
  border:1.5px dashed var(--warm);border-radius:6px;
  padding:2.8rem 2rem;text-align:center;cursor:pointer;
  background:rgba(196,149,106,.04);transition:all .2s;
  margin-bottom:1.8rem;
}
.upload-zone:hover,.upload-zone.drag{background:rgba(196,149,106,.09);border-style:solid}
.upload-zone input{display:none}
.upload-icon{font-size:2.6rem;display:block;margin-bottom:.7rem}
.upload-zone h3{font-family:'Kaisei Decol',serif;font-size:1.05rem;color:var(--sepia);letter-spacing:.12em;margin-bottom:.35rem}
.upload-zone p{font-size:.78rem;color:#b09a7e;letter-spacing:.04em;line-height:1.6}

/* ── Thumb ── */
.thumb-bar{
  display:none;align-items:center;gap:.9rem;
  background:var(--aged);border:1px solid rgba(26,20,16,.1);
  border-radius:5px;padding:.8rem 1.1rem;margin-bottom:1.6rem;
}
.thumb-bar.show{display:flex}
.thumb-bar img{width:64px;height:64px;object-fit:cover;border-radius:4px;border:1px solid rgba(26,20,16,.1)}
.thumb-bar .info{flex:1}
.thumb-bar .info strong{display:block;font-size:.85rem;color:var(--ink);margin-bottom:.15rem}
.thumb-bar .info span{font-size:.76rem;color:var(--sepia)}
.reset-btn{background:transparent;color:var(--sepia);border:1px solid rgba(139,111,71,.4);padding:.32rem .75rem;font-family:'Noto Serif JP',serif;font-size:.73rem;cursor:pointer;border-radius:2px;transition:all .2s;white-space:nowrap}
.reset-btn:hover{border-color:var(--ink);color:var(--ink)}

/* ── Controls ── */
.ctrl-panel{
  background:var(--aged);border:1px solid rgba(26,20,16,.1);
  border-radius:5px;padding:1.4rem 1.6rem;margin-bottom:1.6rem;
  display:none;
}
.ctrl-panel.show{display:block}
.ctrl-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem 1.4rem}
.ctrl-item label{font-size:.65rem;letter-spacing:.16em;color:var(--sepia);text-transform:uppercase;display:block;margin-bottom:.32rem}
.ctrl-item select,.ctrl-item input[type=text]{
  width:100%;border:none;border-bottom:1px solid rgba(26,20,16,.18);
  background:transparent;padding:.28rem 0;font-size:.86rem;
  font-family:'Noto Serif JP',serif;color:var(--ink);outline:none;
}
.ctrl-item.full{grid-column:1/-1}
.ctrl-item textarea{
  width:100%;border:1px solid rgba(26,20,16,.14);border-radius:3px;
  background:rgba(247,243,236,.7);padding:.5rem .65rem;
  font-size:.84rem;font-family:'Noto Serif JP',serif;color:var(--ink);
  outline:none;resize:vertical;min-height:70px;line-height:1.65;
}
.prompt-preview{margin-top:1rem;padding-top:1rem;border-top:1px solid rgba(26,20,16,.1)}
.prompt-preview h4{font-size:.65rem;letter-spacing:.18em;color:var(--sepia);text-transform:uppercase;margin-bottom:.5rem}
.prompt-text{
  font-size:.76rem;color:#7a6a58;line-height:1.7;
  background:rgba(247,243,236,.9);border-radius:3px;
  padding:.55rem .75rem;border-left:2.5px solid var(--warm);
  font-family:'Noto Serif JP',serif;
}

/* ── Generate button ── */
.gen-row{display:flex;align-items:center;gap:1rem;margin-bottom:2rem;flex-wrap:wrap}
.gen-btn{
  flex:1;min-width:180px;border:none;
  background:linear-gradient(135deg,#8b6f47,#c4956a);
  color:#f7f3ec;padding:.65rem 1.4rem;
  font-family:'Noto Serif JP',serif;font-size:.85rem;letter-spacing:.1em;
  cursor:pointer;border-radius:3px;
  box-shadow:0 2px 10px rgba(139,111,71,.3);transition:all .2s;
}
.gen-btn:hover{opacity:.88;transform:translateY(-1px)}
.gen-btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}

/* ── Progress ── */
.progress{display:none;align-items:center;gap:.75rem}
.progress.show{display:flex}
.spinner{width:17px;height:17px;border:2px solid rgba(196,149,106,.25);border-top-color:var(--warm);border-radius:50%;animation:spin .75s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.steps{display:flex;flex-direction:column;gap:.12rem}
.step{font-size:.72rem;color:var(--sepia);opacity:.45;transition:opacity .25s;letter-spacing:.04em}
.step.active{opacity:1;color:var(--warm)}
.step.done{opacity:.55}
.step.done::before{content:'✓ '}

/* ── Preview canvas ── */
.preview-section{display:none;margin-bottom:1.5rem}
.preview-section.show{display:block}
.preview-label{
  font-size:.66rem;letter-spacing:.22em;color:var(--sepia);text-transform:uppercase;
  margin-bottom:.8rem;display:flex;align-items:center;gap:.7rem;
}
.preview-label::after{content:'';flex:1;height:1px;background:rgba(26,20,16,.1)}
#resultCanvas{
  display:block;width:100%;max-width:520px;
  margin:0 auto;border-radius:5px;
  box-shadow:0 4px 28px rgba(26,20,16,.13);
}
.dl-row{display:flex;gap:.7rem;justify-content:center;margin-top:1rem;flex-wrap:wrap}
.dl-btn{
  border:none;padding:.52rem 1.2rem;font-family:'Noto Serif JP',serif;
  font-size:.8rem;letter-spacing:.08em;cursor:pointer;border-radius:2px;transition:opacity .2s;
}
.dl-btn:hover{opacity:.78}
.dl-png{background:var(--ink);color:var(--cream)}
.dl-jpg{background:#3a6b2a;color:var(--cream)}

/* ── Error box ── */
.error-box{
  display:none;background:rgba(139,32,32,.07);
  border:1px solid rgba(139,32,32,.25);border-radius:4px;
  padding:.8rem 1rem;margin-bottom:1.2rem;
  font-size:.8rem;color:var(--accent);line-height:1.6;
}
.error-box.show{display:block}

/* ── Toast ── */
.toast{
  position:fixed;bottom:2rem;left:50%;
  transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--cream);
  padding:.6rem 1.5rem;border-radius:2px;
  font-size:.79rem;letter-spacing:.08em;
  opacity:0;transition:all .3s;pointer-events:none;z-index:99;
  white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── GitHub ── */
.gh-bar{margin-top:3rem;text-align:center;padding-top:1.4rem;border-top:1px solid rgba(26,20,16,.08)}
.gh-bar a{display:inline-flex;align-items:center;gap:.42rem;color:var(--sepia);text-decoration:none;font-size:.76rem;letter-spacing:.1em;border-bottom:1px solid rgba(139,111,71,.3);padding-bottom:1px;transition:opacity .2s}
.gh-bar a:hover{opacity:.6}

@media(max-width:580px){
  .ctrl-grid{grid-template-columns:1fr}
  .gen-row{flex-direction:column}
  .gen-btn{min-width:auto;width:100%}
}
</style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <header class="header">
    <h1>日系手繪筆記</h1>
    <p>JAPANESE  HANDWRITTEN  NOTE  GENERATOR</p>
  </header>

  <!-- API Key -->
  <div class="key-section">
    <h3>🔑 Anthropic API Key</h3>
    <div class="key-row">
      <input type="password" id="keyInput"
        placeholder="輸入你的 sk-ant-api03-… Key，按儲存後即可使用"
        autocomplete="off" spellcheck="false">
      <button class="key-save-btn" onclick="saveKey()">儲存</button>
    </div>
    <div id="keyStatus" class="key-status empty">尚未設定 API Key</div>
    <p class="key-hint">
      Key 僅暫存於此瀏覽器 Session，關閉分頁即消失，不會傳送至任何第三方。
      &nbsp;→&nbsp;<a href="https://console.anthropic.com/keys" target="_blank">前往 Anthropic Console 取得 Key ↗</a>
    </p>
  </div>

  <!-- Upload -->
  <div class="upload-zone" id="uploadZone">
    <input type="file" id="fileInput" accept="image/*">
    <span class="upload-icon">📷</span>
    <h3>上傳你的照片</h3>
    <p>清酒・香氛・護膚品・食物・生活擺拍皆可<br>支援 JPG · PNG · WEBP</p>
  </div>

  <!-- Thumb bar -->
  <div class="thumb-bar" id="thumbBar">
    <img id="thumbImg" src="" alt="">
    <div class="info">
      <strong id="thumbName"></strong>
      <span id="thumbMeta"></span>
    </div>
    <button class="reset-btn" onclick="resetUpload()">重新選擇</button>
  </div>

  <!-- Controls -->
  <div class="ctrl-panel" id="ctrlPanel">
    <div class="ctrl-grid">
      <div class="ctrl-item">
        <label>主體類型</label>
        <select id="selSubject">
          <option value="清酒">清酒 🍶</option>
          <option value="香氛蠟燭">香氛蠟燭 🕯️</option>
          <option value="護膚品">護膚品 🧴</option>
          <option value="咖啡">咖啡 ☕</option>
          <option value="甜點">甜點 🍰</option>
          <option value="花藝">花藝 🌸</option>
          <option value="文具">文具 ✒️</option>
          <option value="商品">其他商品 🛍️</option>
        </select>
      </div>
      <div class="ctrl-item">
        <label>色調氛圍</label>
        <select id="selMood">
          <option value="溫暖奶茶色調、自然生活感">溫暖奶茶 🤎</option>
          <option value="清新薄荷綠、日式侘寂感">清新薄荷 🌿</option>
          <option value="浪漫玫瑰粉、少女感">浪漫玫瑰 🌸</option>
          <option value="沉穩深藍、文青冷冽感">文青深藍 🫧</option>
          <option value="米白極簡、北歐清冷感">北歐極簡 🤍</option>
          <option value="暖橘夕陽、復古底片感">復古底片 🎞️</option>
        </select>
      </div>
      <div class="ctrl-item full">
        <label>手寫文字（留空由 AI 自動根據照片生成）</label>
        <textarea id="txtCustom" placeholder="例：今日份的小確幸 ✦ 十四代清酒 / 口感清雅細膩 / 餘韻悠長&#10;留空則 AI 自動填寫，可包含中文、日文、英文裝飾字"></textarea>
      </div>
      <div class="ctrl-item full">
        <label>附加說明（選填）</label>
        <input type="text" id="txtExtra" placeholder="例：強調天然釀造 / 加入更多日文假名 / 整體更療癒可愛">
      </div>
    </div>
    <div class="prompt-preview">
      <h4>將發送給 AI 的指令預覽</h4>
      <div class="prompt-text" id="promptText">—</div>
    </div>
  </div>

  <!-- Error -->
  <div class="error-box" id="errorBox"></div>

  <!-- Generate row -->
  <div class="gen-row">
    <button class="gen-btn" id="genBtn" disabled onclick="generate()">
      ✦ 生成手繪筆記風排版
    </button>
    <div class="progress" id="progress">
      <div class="spinner"></div>
      <div class="steps">
        <div class="step" id="s1">分析照片內容…</div>
        <div class="step" id="s2">規劃版面配置…</div>
        <div class="step" id="s3">繪製手繪元素…</div>
        <div class="step" id="s4">完成輸出…</div>
      </div>
    </div>
  </div>

  <!-- Result -->
  <div class="preview-section" id="previewSection">
    <div class="preview-label">介紹卡預覽 · 1080 × 1350 px · 4:5</div>
    <canvas id="resultCanvas" width="1080" height="1350"></canvas>
    <div class="dl-row">
      <button class="dl-btn dl-png" onclick="dlCard('png')">⬇ 下載 PNG</button>
      <button class="dl-btn dl-jpg" onclick="dlCard('jpg')">⬇ 下載 JPG</button>
    </div>
  </div>

  <div class="gh-bar">
    <a href="https://github.com/" target="_blank">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
      前往 GitHub 部署
    </a>
  </div>
</div>

<div class="toast" id="toastEl"></div>

<script>
// ═══════════════ STATE ═══════════════
let uploadedImage = null;
let b64Data = null, b64Type = null;

// ═══════════════ API KEY ═══════════════
function saveKey() {
  const raw = document.getElementById('keyInput').value.trim();
  const st  = document.getElementById('keyStatus');
  if (!raw) {
    st.textContent = '請輸入 Key';
    st.className   = 'key-status err';
    return;
  }
  if (!raw.startsWith('sk-ant-')) {
    st.textContent = '格式不正確，應以 sk-ant- 開頭';
    st.className   = 'key-status err';
    return;
  }
  sessionStorage.setItem('_ak', raw);
  document.getElementById('keyInput').value = '';
  st.textContent = '✓ 已儲存，可以開始生成';
  st.className   = 'key-status ok';
  // Re-evaluate generate button
  checkGenBtn();
  toast('API Key 已儲存 ✓');
}

function getKey() { return sessionStorage.getItem('_ak') || ''; }

// On load: restore status if key exists
(function() {
  if (getKey()) {
    const st = document.getElementById('keyStatus');
    st.textContent = '✓ 已儲存';
    st.className   = 'key-status ok';
  }
})();

// Also allow Enter key in key input
document.getElementById('keyInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') saveKey();
});

// ═══════════════ UPLOAD ═══════════════
const uploadZone = document.getElementById('uploadZone');
const fileInput  = document.getElementById('fileInput');

uploadZone.addEventListener('click', () => fileInput.click());
['dragover','dragenter'].forEach(ev =>
  uploadZone.addEventListener(ev, e => { e.preventDefault(); uploadZone.classList.add('drag'); }));
['dragleave','drop'].forEach(ev =>
  uploadZone.addEventListener(ev, () => uploadZone.classList.remove('drag')));
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if (f && f.type.startsWith('image/')) handleFile(f);
});
fileInput.addEventListener('change', e => {
  if (e.target.files[0]) handleFile(e.target.files[0]);
});

function handleFile(file) {
  const reader = new FileReader();
  reader.onload = ev => {
    b64Data = ev.target.result.split(',')[1];
    b64Type = file.type;
    const img = new Image();
    img.onload = () => {
      uploadedImage = img;
      // Show thumb
      document.getElementById('thumbImg').src  = ev.target.result;
      document.getElementById('thumbName').textContent = file.name;
      document.getElementById('thumbMeta').textContent =
        `${img.width} × ${img.height}  ·  ${(file.size/1024).toFixed(0)} KB`;
      document.getElementById('thumbBar').classList.add('show');
      document.getElementById('uploadZone').style.display = 'none';
      document.getElementById('ctrlPanel').classList.add('show');
      updatePrompt();
      checkGenBtn();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function resetUpload() {
  uploadedImage = b64Data = b64Type = null;
  document.getElementById('thumbBar').classList.remove('show');
  document.getElementById('uploadZone').style.display = '';
  document.getElementById('ctrlPanel').classList.remove('show');
  document.getElementById('previewSection').classList.remove('show');
  document.getElementById('errorBox').classList.remove('show');
  fileInput.value = '';
  checkGenBtn();
}

// ═══════════════ CONTROLS ═══════════════
['selSubject','selMood','txtCustom','txtExtra'].forEach(id =>
  document.getElementById(id).addEventListener('input', updatePrompt));
['selSubject','selMood'].forEach(id =>
  document.getElementById(id).addEventListener('change', updatePrompt));

function updatePrompt() {
  const s = document.getElementById('selSubject').value;
  const m = document.getElementById('selMood').value;
  const c = document.getElementById('txtCustom').value.trim();
  const e = document.getElementById('txtExtra').value.trim();
  document.getElementById('promptText').textContent =
    `分析這張${s}照片，生成日系手繪筆記風排版。` +
    `色調：${m}。` +
    (c ? `手寫文字內容：「${c}」。` : `手寫文字由 AI 根據照片自動生成。`) +
    (e ? `附加要求：${e}。` : '');
}

function checkGenBtn() {
  document.getElementById('genBtn').disabled = !(uploadedImage && getKey());
}

// ═══════════════ PROGRESS ═══════════════
let stepIdx = 0, stepTimer = null;
const STEP_IDS = ['s1','s2','s3','s4'];

function startProgress() {
  stepIdx = 0;
  STEP_IDS.forEach(id => { const el=document.getElementById(id); el.className='step'; });
  document.getElementById('progress').classList.add('show');
  document.getElementById('genBtn').disabled = true;
  document.getElementById('errorBox').classList.remove('show');
  stepTimer = setInterval(() => {
    if (stepIdx > 0) {
      document.getElementById(STEP_IDS[stepIdx-1]).classList.replace('active','done');
    }
    if (stepIdx < STEP_IDS.length) {
      document.getElementById(STEP_IDS[stepIdx]).classList.add('active');
    }
    stepIdx++;
    if (stepIdx > STEP_IDS.length) clearInterval(stepTimer);
  }, 1100);
}

function stopProgress(success) {
  clearInterval(stepTimer);
  document.getElementById('progress').classList.remove('show');
  STEP_IDS.forEach(id => {
    const el=document.getElementById(id);
    if (success) el.classList.add('done');
    else el.className='step';
  });
  document.getElementById('genBtn').disabled = false;
}

// ═══════════════ GENERATE ═══════════════
async function generate() {
  const key = getKey();
  if (!key) { toast('請先輸入並儲存 API Key'); return; }
  if (!uploadedImage) { toast('請先上傳照片'); return; }

  startProgress();

  const subject = document.getElementById('selSubject').value;
  const mood    = document.getElementById('selMood').value;
  const custom  = document.getElementById('txtCustom').value.trim();
  const extra   = document.getElementById('txtExtra').value.trim();

  const systemPrompt = `你是一位日系手繪筆記風版面設計師。
分析用戶上傳的商品照片，設計一張「日系手繪筆記風」IG貼文（4:5，1080×1350px）。

只回傳 JSON，不加任何說明或 markdown 標記。格式：
{
  "bg_color": "#f7f0e6",
  "photo_x": 0.5,
  "photo_y": 0.5,
  "photo_scale": 0.62,
  "handwritten_texts": [
    {"text":"文字","x":0.5,"y":0.12,"size":52,"color":"#3d2b1f","angle":-1.5,"align":"center"},
    {"text":"副文字","x":0.15,"y":0.28,"size":30,"color":"#8b6f47","angle":-2,"align":"left"},
    {"text":"にほんご","x":0.82,"y":0.35,"size":24,"color":"#c4956a","angle":1,"align":"right"}
  ],
  "doodles": [
    {"type":"heart","x":0.12,"y":0.15,"size":28,"color":"#c4956a","angle":12},
    {"type":"star","x":0.88,"y":0.18,"size":20,"color":"#8b6f47","angle":0},
    {"type":"arrow","x":0.38,"y":0.32,"size":36,"color":"#c4956a","angle":8},
    {"type":"circle_frame","x":0.5,"y":0.5,"size":220,"color":"rgba(139,111,71,0.35)","angle":0},
    {"type":"dots","x":0.08,"y":0.65,"size":6,"color":"#c4956a","angle":0},
    {"type":"wavy_line","x":0.5,"y":0.82,"size":140,"color":"#8b6f47","angle":0},
    {"type":"asterisk","x":0.9,"y":0.75,"size":16,"color":"#c4956a","angle":20}
  ],
  "highlight_boxes": [
    {"x":0.5,"y":0.88,"width":0.44,"height":0.055,"color":"#c4956a","text":"重點文字","text_color":"#3d2b1f"}
  ]
}

規則：
- 所有 x/y 為 0~1 比例座標（0.5=中央）
- photo_scale 0.5~0.75，photo_x/y 控制照片中心位置
- handwritten_texts 至少4條：主標題(size 42-60)、副標題(28-36)、日文小字(20-28)、英文裝飾(18-24)
- doodles 至少7個，分散在照片四周，不要遮住主體臉/標籤
- highlight_boxes 1~2個
- 整體溫柔療癒、日系手帳感`;

  const userPrompt =
    `請分析這張${subject}照片並生成版面設計。\n` +
    `色調風格：${mood}。\n` +
    (custom
      ? `手寫文字請務必包含：「${custom}」，可在此基礎上增加裝飾文字。\n`
      : `手寫文字請根據照片自動生成，要有：中文主標題、一句日文小字、英文裝飾字母。\n`) +
    (extra ? `額外要求：${extra}\n` : '') +
    `只回傳 JSON，不要加任何說明。`;

  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type':                          'application/json',
        'x-api-key':                             key,
        'anthropic-version':                     '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1800,
        system: systemPrompt,
        messages: [{
          role: 'user',
          content: [
            { type: 'image', source: { type: 'base64', media_type: b64Type, data: b64Data } },
            { type: 'text',  text: userPrompt }
          ]
        }]
      })
    });

    if (!resp.ok) {
      const errData = await resp.json().catch(() => ({}));
      const msg = errData.error?.message || `HTTP ${resp.status}`;
      throw new Error(msg);
    }

    const data = await resp.json();
    const raw  = data.content?.find(c => c.type === 'text')?.text || '';
    const m    = raw.match(/\{[\s\S]*\}/);
    if (!m) throw new Error('AI 未回傳有效版面資料，請重試');

    const layout = JSON.parse(m[0]);
    await renderCard(layout);
    stopProgress(true);
    document.getElementById('previewSection').classList.add('show');
    document.getElementById('previewSection').scrollIntoView({ behavior:'smooth', block:'start' });
    toast('✦ 手繪筆記已生成！');

  } catch(err) {
    stopProgress(false);
    const box = document.getElementById('errorBox');
    box.textContent = '生成失敗：' + err.message;
    box.classList.add('show');
    console.error(err);
  }
}

// ═══════════════ RENDER ═══════════════
async function renderCard(layout) {
  const canvas = document.getElementById('resultCanvas');
  const CW=1080, CH=1350;
  canvas.width=CW; canvas.height=CH;
  const ctx = canvas.getContext('2d');

  // Background
  ctx.fillStyle = layout.bg_color || '#f7f0e6';
  ctx.fillRect(0,0,CW,CH);

  // Paper lines
  ctx.save();
  ctx.strokeStyle='rgba(139,111,71,0.065)';
  ctx.lineWidth=0.7;
  for(let y=54;y<CH;y+=46){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(CW,y);ctx.stroke();}
  ctx.restore();

  // Corner brackets
  [[30,30,0],[CW-30,30,90],[30,CH-30,-90],[CW-30,CH-30,180]].forEach(([x,y,r])=>{
    ctx.save(); ctx.translate(x,y); ctx.rotate(r*Math.PI/180);
    ctx.strokeStyle='rgba(139,111,71,0.38)'; ctx.lineWidth=1.8; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(0,22); ctx.lineTo(0,0); ctx.lineTo(22,0); ctx.stroke();
    ctx.restore();
  });

  // Photo
  if (uploadedImage) {
    const px=(layout.photo_x||0.5)*CW, py=(layout.photo_y||0.5)*CH;
    const scl=Math.min(Math.max(layout.photo_scale||0.62,0.35),0.82);
    const base=Math.min(CW,CH)*scl;
    const rat=uploadedImage.width/uploadedImage.height;
    const pw=rat>=1?base:base*rat, ph=rat<1?base:base/rat;

    ctx.save(); ctx.translate(px,py);
    ctx.shadowColor='rgba(26,20,16,0.14)';
    ctx.shadowBlur=30; ctx.shadowOffsetX=3; ctx.shadowOffsetY=5;
    rrect(ctx,-pw/2,-ph/2,pw,ph,14); ctx.clip();
    ctx.shadowColor='transparent';
    ctx.drawImage(uploadedImage,-pw/2,-ph/2,pw,ph);
    ctx.restore();

    ctx.save(); ctx.translate(px,py);
    ctx.strokeStyle='rgba(139,111,71,0.28)'; ctx.lineWidth=1.5;
    rrect(ctx,-pw/2,-ph/2,pw,ph,14); ctx.stroke();
    ctx.restore();
  }

  await document.fonts.ready;

  // Doodles
  (layout.doodles||[]).forEach(d=>drawDoodle(ctx,d,CW,CH));
  // Texts
  (layout.handwritten_texts||[]).forEach(t=>drawText(ctx,t,CW,CH));
  // Highlight boxes
  (layout.highlight_boxes||[]).forEach(h=>drawBox(ctx,h,CW,CH));
  // Stamp
  drawStamp(ctx,CW,CH);
}

function rrect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
}

function drawText(ctx,t,CW,CH){
  ctx.save();
  ctx.translate(t.x*CW, t.y*CH);
  ctx.rotate((t.angle||0)*Math.PI/180);
  ctx.font=`400 ${t.size||32}px 'Ma Shan Zheng',cursive`;
  ctx.fillStyle=t.color||'#3d2b1f';
  ctx.textAlign=t.align||'center';
  ctx.globalAlpha=0.9;
  String(t.text).split('\n').forEach((ln,i)=>{
    ctx.fillText(ln, 0, i*(t.size||32)*1.4);
  });
  ctx.restore();
}

function drawDoodle(ctx,d,CW,CH){
  const x=d.x*CW, y=d.y*CH, sz=Math.max(8,d.size||22);
  ctx.save();
  ctx.translate(x,y); ctx.rotate((d.angle||0)*Math.PI/180);
  ctx.strokeStyle=d.color||'#c4956a';
  ctx.fillStyle=d.color||'#c4956a';
  ctx.lineWidth=Math.max(1.4, sz*0.055);
  ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.globalAlpha=0.72;

  const r=sz/2;
  switch(d.type){
    case 'heart':
      ctx.beginPath();
      ctx.moveTo(0,r*0.35);
      ctx.bezierCurveTo(-r*0.6,-r*0.1,-r*0.85,r*0.45,0,r);
      ctx.bezierCurveTo(r*0.85,r*0.45,r*0.6,-r*0.1,0,r*0.35);
      ctx.stroke(); break;
    case 'star':
      ctx.beginPath();
      for(let i=0;i<5;i++){
        const a1=i*4*Math.PI/5-Math.PI/2;
        const a2=(i*4+2)*Math.PI/5-Math.PI/2;
        i===0?ctx.moveTo(Math.cos(a1)*r,Math.sin(a1)*r):ctx.lineTo(Math.cos(a1)*r,Math.sin(a1)*r);
        ctx.lineTo(Math.cos(a2)*r*0.38,Math.sin(a2)*r*0.38);
      }
      ctx.closePath(); ctx.stroke(); break;
    case 'arrow':
      ctx.beginPath();
      ctx.moveTo(-r,0); ctx.lineTo(r,0);
      ctx.moveTo(r-r*0.3,-r*0.22); ctx.lineTo(r,0); ctx.lineTo(r-r*0.3,r*0.22);
      ctx.stroke(); break;
    case 'circle_frame':
      ctx.beginPath();
      for(let a=0;a<=Math.PI*2;a+=0.07){
        const j=1+(Math.random()-0.5)*0.03;
        const rx=Math.cos(a)*r*j, ry=Math.sin(a)*r*j;
        a===0?ctx.moveTo(rx,ry):ctx.lineTo(rx,ry);
      }
      ctx.closePath(); ctx.stroke(); break;
    case 'cloud_frame':
      ctx.beginPath();
      for(let a=0;a<=Math.PI*2;a+=0.1){
        const j=1+Math.sin(a*6)*0.06;
        const rx=Math.cos(a)*r*j, ry=Math.sin(a)*r*0.65*j;
        a===0?ctx.moveTo(rx,ry):ctx.lineTo(rx,ry);
      }
      ctx.closePath(); ctx.stroke(); break;
    case 'dots':
      for(let i=-2;i<=2;i++) for(let j=-2;j<=2;j++){
        ctx.beginPath(); ctx.arc(i*sz*1.3,j*sz*1.3,r*0.28,0,Math.PI*2); ctx.fill();
      } break;
    case 'wavy_line':
      ctx.beginPath(); ctx.moveTo(-r,0);
      for(let tx=-r;tx<=r;tx+=5) ctx.lineTo(tx,Math.sin((tx/r)*Math.PI*2)*r*0.1);
      ctx.stroke(); break;
    case 'asterisk':
      for(let a=0;a<Math.PI;a+=Math.PI/3){
        ctx.beginPath();
        ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r);
        ctx.lineTo(-Math.cos(a)*r,-Math.sin(a)*r);
        ctx.stroke();
      } break;
    default:
      ctx.beginPath(); ctx.arc(0,0,r*0.4,0,Math.PI*2); ctx.stroke();
  }
  ctx.restore();
}

function drawBox(ctx,h,CW,CH){
  const cx=h.x*CW, cy=h.y*CH;
  const bw=h.width*CW, bh=h.height*CH;
  ctx.save(); ctx.translate(cx,cy);
  ctx.strokeStyle=h.color||'#c4956a';
  ctx.lineWidth=2; ctx.lineCap='round'; ctx.globalAlpha=0.72;
  const hw=bw/2, hh=bh/2;
  ctx.beginPath();
  ctx.moveTo(-hw+2,-hh); ctx.lineTo(hw-2,-hh+1);
  ctx.lineTo(hw,hh-1); ctx.lineTo(-hw+2,hh);
  ctx.closePath(); ctx.stroke();
  if(h.text){
    ctx.font=`400 ${Math.round(bh*0.52)}px 'Ma Shan Zheng',cursive`;
    ctx.fillStyle=h.text_color||'#3d2b1f';
    ctx.textAlign='center'; ctx.globalAlpha=0.88;
    ctx.fillText(h.text,0,bh*0.18);
  }
  ctx.restore();
}

function drawStamp(ctx,CW,CH){
  ctx.save(); ctx.translate(CW-50,CH-50); ctx.rotate(-0.16);
  ctx.strokeStyle='rgba(139,32,32,0.28)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(0,0,24,0,Math.PI*2); ctx.stroke();
  ctx.font=`700 12px 'Kaisei Decol',serif`; ctx.fillStyle='rgba(139,32,32,0.3)'; ctx.textAlign='center';
  ctx.fillText('手繪',0,-4);
  ctx.font=`400 7.5px 'Noto Serif JP',serif`; ctx.fillText('NOTE',0,7);
  ctx.restore();
}

// ═══════════════ DOWNLOAD ═══════════════
function dlCard(fmt){
  const canvas=document.getElementById('resultCanvas');
  if(!canvas.width){toast('請先生成圖片');return;}
  const url=canvas.toDataURL(fmt==='jpg'?'image/jpeg':'image/png',0.93);
  const a=document.createElement('a');
  a.href=url; a.download=`handwritten-note.${fmt}`; a.click();
  toast(`✦ 已下載 ${fmt.toUpperCase()}！`);
}

// ═══════════════ TOAST ═══════════════
function toast(msg){
  const t=document.getElementById('toastEl');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}
</script>

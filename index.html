<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日系手繪筆記 · Handwritten Note Generator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@400;700&family=Noto+Serif+JP:wght@300;400;700&family=Ma+Shan+Zheng&display=swap');

*{margin:0;padding:0;box-sizing:border-box}
:root{
  --cream:#f7f3ec;--aged:#ede8dc;--ink:#1a1410;
  --sepia:#8b6f47;--accent:#8b2020;--warm:#c4956a;
}
body{background:var(--cream);font-family:'Noto Serif JP',serif;min-height:100vh;color:var(--ink)}

.app{max-width:860px;margin:0 auto;padding:2.5rem 1.5rem 5rem}

/* Header */
.header{text-align:center;margin-bottom:2.8rem}
.header h1{font-family:'Kaisei Decol',serif;font-size:2.2rem;font-weight:700;letter-spacing:.25em;color:var(--ink)}
.header h1::after{content:'';display:block;width:40%;height:1px;background:var(--ink);opacity:.15;margin:.5rem auto 0}
.header p{font-size:.76rem;letter-spacing:.2em;color:var(--sepia);margin-top:.5rem}

/* Upload */
.upload-zone{
  border:1.5px dashed var(--warm);border-radius:6px;
  padding:3rem 2rem;text-align:center;cursor:pointer;
  background:rgba(196,149,106,.04);transition:all .2s;
  margin-bottom:2rem;position:relative;
}
.upload-zone:hover{background:rgba(196,149,106,.09);border-style:solid}
.upload-zone.drag{background:rgba(196,149,106,.14);border-style:solid}
.upload-zone input{display:none}
.upload-icon{font-size:2.8rem;display:block;margin-bottom:.8rem}
.upload-zone h3{font-family:'Kaisei Decol',serif;font-size:1.1rem;color:var(--sepia);letter-spacing:.12em;margin-bottom:.4rem}
.upload-zone p{font-size:.8rem;color:#b09a7e;letter-spacing:.06em}

/* Controls */
.controls-panel{
  background:var(--aged);border:1px solid rgba(26,20,16,.1);
  border-radius:5px;padding:1.4rem 1.6rem;margin-bottom:1.8rem;
  display:none;
}
.controls-panel.visible{display:block}
.ctrl-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.ctrl-item label{font-size:.68rem;letter-spacing:.15em;color:var(--sepia);text-transform:uppercase;display:block;margin-bottom:.35rem}
.ctrl-item select, .ctrl-item input[type=text]{
  width:100%;border:none;border-bottom:1px solid rgba(26,20,16,.2);
  background:transparent;padding:.3rem 0;font-size:.88rem;
  font-family:'Noto Serif JP',serif;color:var(--ink);outline:none;
}
.ctrl-item.full{grid-column:1/-1}
.ctrl-item textarea{
  width:100%;border:1px solid rgba(26,20,16,.15);border-radius:3px;
  background:rgba(247,243,236,.6);padding:.5rem .6rem;
  font-size:.85rem;font-family:'Noto Serif JP',serif;
  color:var(--ink);outline:none;resize:vertical;min-height:72px;
  line-height:1.65;
}

/* Prompt section */
.prompt-section{margin-top:1rem;padding-top:1rem;border-top:1px solid rgba(26,20,16,.1)}
.prompt-section h4{font-size:.72rem;letter-spacing:.18em;color:var(--sepia);text-transform:uppercase;margin-bottom:.6rem}
.prompt-display{
  font-size:.78rem;color:#7a6a58;line-height:1.7;
  background:rgba(247,243,236,.8);border-radius:3px;
  padding:.6rem .8rem;border-left:2px solid var(--warm);
  font-family:'Noto Serif JP',serif;letter-spacing:.03em;
}

/* Generate button */
.btn-row{display:flex;gap:.8rem;margin-bottom:2rem;align-items:center;flex-wrap:wrap}
.btn{
  border:none;padding:.6rem 1.4rem;font-family:'Noto Serif JP',serif;
  font-size:.82rem;letter-spacing:.1em;cursor:pointer;border-radius:3px;transition:all .2s;
}
.btn-generate{
  background:linear-gradient(135deg, #8b6f47, #c4956a);
  color:#f7f3ec;flex:1;min-width:160px;
  box-shadow:0 2px 8px rgba(139,111,71,.3);
}
.btn-generate:hover{opacity:.88;transform:translateY(-1px)}
.btn-generate:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-outline{background:transparent;color:var(--ink);border:1px solid rgba(26,20,16,.3)}
.btn-outline:hover{background:rgba(26,20,16,.05)}
.btn-dl{background:var(--ink);color:var(--cream)}
.btn-dl:hover{opacity:.78}
.btn-dl-jpg{background:#3a6b2a;color:var(--cream)}
.btn-dl-jpg:hover{opacity:.78}

/* Progress */
.progress{display:none;align-items:center;gap:.8rem;color:var(--sepia);font-size:.8rem;letter-spacing:.1em}
.progress.visible{display:flex}
.spinner{width:18px;height:18px;border:2px solid rgba(139,111,71,.2);border-top-color:var(--warm);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.progress-steps{display:flex;flex-direction:column;gap:.15rem}
.step{font-size:.74rem;opacity:.5;transition:opacity .3s}
.step.active{opacity:1;color:var(--warm)}
.step.done{opacity:.6}
.step.done::before{content:'✓ '}

/* Canvas preview */
.preview-wrap{display:none;margin-bottom:1.5rem}
.preview-wrap.visible{display:block}
.preview-label{font-size:.68rem;letter-spacing:.22em;color:var(--sepia);text-transform:uppercase;margin-bottom:.8rem;display:flex;align-items:center;gap:.7rem}
.preview-label::after{content:'';flex:1;height:1px;background:rgba(26,20,16,.1)}
#resultCanvas{
  display:block;width:100%;max-width:540px;
  margin:0 auto;border-radius:4px;
  box-shadow:0 4px 24px rgba(26,20,16,.12);
}

/* Photo preview thumbnail */
.thumb-wrap{display:none;margin-bottom:1.2rem}
.thumb-wrap.visible{display:flex;align-items:center;gap:.8rem}
#thumbImg{width:72px;height:72px;object-fit:cover;border-radius:4px;border:1px solid rgba(26,20,16,.12)}
.thumb-info{font-size:.8rem;color:var(--sepia)}
.thumb-info strong{display:block;color:var(--ink);font-size:.85rem;margin-bottom:.2rem}

/* Toast */
.toast{
  position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--cream);padding:.6rem 1.5rem;
  border-radius:2px;font-size:.8rem;letter-spacing:.1em;
  opacity:0;transition:all .3s;pointer-events:none;z-index:99;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* GitHub */
.github-bar{margin-top:3rem;text-align:center;padding-top:1.4rem;border-top:1px solid rgba(26,20,16,.08)}
.github-bar a{display:inline-flex;align-items:center;gap:.45rem;color:var(--sepia);text-decoration:none;font-size:.78rem;letter-spacing:.1em;border-bottom:1px solid rgba(139,111,71,.3);padding-bottom:1px;transition:opacity .2s}
.github-bar a:hover{opacity:.6}

@media(max-width:600px){
  .ctrl-grid{grid-template-columns:1fr}
  .btn-row{flex-direction:column}
  .btn-generate{min-width:auto;width:100%}
}
</style>
</head>
<body>
<div class="app">

  <header class="header">
    <h1>日系手繪筆記</h1>
    <p>JAPANESE  HANDWRITTEN  NOTE  GENERATOR</p>
  </header>

  <!-- Upload -->
  <div class="upload-zone" id="uploadZone">
    <input type="file" id="fileInput" accept="image/*">
    <span class="upload-icon">📷</span>
    <h3>上傳你的照片</h3>
    <p>清酒・香氛・商品・食物・生活擺拍皆可<br>支援 JPG · PNG · WEBP</p>
  </div>

  <!-- Thumb preview -->
  <div class="thumb-wrap" id="thumbWrap">
    <img id="thumbImg" src="" alt="">
    <div class="thumb-info">
      <strong id="thumbName">—</strong>
      <span id="thumbSize">—</span>
    </div>
    <button class="btn btn-outline" onclick="resetUpload()" style="margin-left:auto;font-size:.74rem;padding:.38rem .8rem">重新選擇</button>
  </div>

  <!-- Controls -->
  <div class="controls-panel" id="controlsPanel">
    <div class="ctrl-grid">
      <div class="ctrl-item">
        <label>主體類型</label>
        <select id="subjectType">
          <option value="清酒">清酒 🍶</option>
          <option value="香氛蠟燭">香氛蠟燭 🕯️</option>
          <option value="護膚品">護膚品 🧴</option>
          <option value="咖啡">咖啡 ☕</option>
          <option value="甜點">甜點 🍰</option>
          <option value="花藝">花藝 🌸</option>
          <option value="文具">文具 ✒️</option>
          <option value="商品">其他商品 🛍️</option>
        </select>
      </div>
      <div class="ctrl-item">
        <label>色調氛圍</label>
        <select id="moodTone">
          <option value="溫暖奶茶色調、自然生活感">溫暖奶茶 🤎</option>
          <option value="清新薄荷綠、日式侘寂感">清新薄荷 🌿</option>
          <option value="浪漫玫瑰粉、少女感">浪漫玫瑰 🌸</option>
          <option value="沉穩深藍、文青冷冽感">文青深藍 🫧</option>
          <option value="米白極簡、北歐清冷感">北歐極簡 🤍</option>
          <option value="暖橘夕陽、復古底片感">復古底片 🎞️</option>
        </select>
      </div>
      <div class="ctrl-item full">
        <label>手寫文字內容（可自訂，留空自動生成）</label>
        <textarea id="customText" placeholder="例：今日份的小確幸 ✦ 獺祭二割三分 / 口感清雅細膩 / 餘韻悠長&#10;留空則由 AI 根據照片自動填寫"></textarea>
      </div>
      <div class="ctrl-item full">
        <label>附加說明（可留空）</label>
        <input type="text" id="extraNote" placeholder="例：這是送給朋友的生日禮物 / 強調天然成分 / 加入日文假名">
      </div>
    </div>

    <div class="prompt-section">
      <h4>將發送給 AI 的生成指令</h4>
      <div class="prompt-display" id="promptDisplay">選擇主體與色調後將在此顯示…</div>
    </div>
  </div>

  <!-- Generate + export buttons -->
  <div class="btn-row">
    <button class="btn btn-generate" id="generateBtn" onclick="generate()" disabled>
      ✦ 生成手繪筆記風排版
    </button>
    <div class="progress" id="progress">
      <div class="spinner"></div>
      <div class="progress-steps">
        <div class="step" id="s1">分析照片內容…</div>
        <div class="step" id="s2">規劃版面配置…</div>
        <div class="step" id="s3">繪製手繪元素…</div>
        <div class="step" id="s4">完成輸出…</div>
      </div>
    </div>
  </div>

  <!-- Result -->
  <div class="preview-wrap" id="previewWrap">
    <div class="preview-label">介紹卡預覽 · 1080 × 1350 px · 4:5</div>
    <canvas id="resultCanvas" width="1080" height="1350"></canvas>
    <div class="btn-row" style="margin-top:1rem;justify-content:center">
      <button class="btn btn-dl" onclick="downloadAs('png')">⬇ 下載 PNG</button>
      <button class="btn btn-dl-jpg" onclick="downloadAs('jpg')">⬇ 下載 JPG</button>
    </div>
  </div>

  <div class="github-bar">
    <a href="https://github.com/" target="_blank">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
      前往 GitHub 部署
    </a>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── State ──
let uploadedFile = null;
let uploadedImage = null;
let b64Data = null;
let b64Type = null;
let lastLayout = null;

// ── Upload ──
const uploadZone = document.getElementById('uploadZone');
const fileInput  = document.getElementById('fileInput');

uploadZone.addEventListener('click', () => fileInput.click());
uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault(); uploadZone.classList.remove('drag');
  const f = e.dataTransfer.files[0];
  if (f && f.type.startsWith('image/')) handleFile(f);
});
fileInput.addEventListener('change', e => { if (e.target.files[0]) handleFile(e.target.files[0]); });

function handleFile(file) {
  uploadedFile = file;
  const reader = new FileReader();
  reader.onload = ev => {
    b64Data = ev.target.result.split(',')[1];
    b64Type = file.type;

    const img = new Image();
    img.onload = () => {
      uploadedImage = img;
      // Show thumb
      document.getElementById('thumbImg').src = ev.target.result;
      document.getElementById('thumbName').textContent = file.name;
      document.getElementById('thumbSize').textContent = `${img.width} × ${img.height} · ${(file.size/1024).toFixed(0)} KB`;
      document.getElementById('thumbWrap').classList.add('visible');
      document.getElementById('uploadZone').style.display = 'none';
      document.getElementById('controlsPanel').classList.add('visible');
      document.getElementById('generateBtn').disabled = false;
      updatePromptDisplay();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function resetUpload() {
  uploadedFile = uploadedImage = b64Data = b64Type = null;
  document.getElementById('thumbWrap').classList.remove('visible');
  document.getElementById('uploadZone').style.display = '';
  document.getElementById('controlsPanel').classList.remove('visible');
  document.getElementById('generateBtn').disabled = true;
  document.getElementById('previewWrap').classList.remove('visible');
  fileInput.value = '';
}

// ── Prompt preview ──
function updatePromptDisplay() {
  const subject = document.getElementById('subjectType').value;
  const mood    = document.getElementById('moodTone').value;
  const custom  = document.getElementById('customText').value.trim();
  const extra   = document.getElementById('extraNote').value.trim();
  const pd = document.getElementById('promptDisplay');
  pd.textContent =
    `分析這張${subject}照片，生成日系手繪筆記風排版。` +
    `色調：${mood}。` +
    (custom ? `手寫文字內容：「${custom}」。` : `手寫文字由AI根據照片內容自動生成。`) +
    (extra ? `附加要求：${extra}。` : '') +
    `回傳 JSON 格式的版面設計指令。`;
}
['subjectType','moodTone','customText','extraNote'].forEach(id => {
  document.getElementById(id).addEventListener('input', updatePromptDisplay);
  document.getElementById(id).addEventListener('change', updatePromptDisplay);
});

// ── Progress steps ──
let stepTimer = null;
function startProgress() {
  const steps = ['s1','s2','s3','s4'];
  steps.forEach(s => { const el=document.getElementById(s); el.className='step'; });
  document.getElementById('progress').classList.add('visible');
  document.getElementById('generateBtn').disabled = true;
  let idx = 0;
  stepTimer = setInterval(() => {
    if (idx > 0) {
      document.getElementById(steps[idx-1]).classList.remove('active');
      document.getElementById(steps[idx-1]).classList.add('done');
    }
    if (idx < steps.length) {
      document.getElementById(steps[idx]).classList.add('active');
      idx++;
    }
  }, 900);
}
function stopProgress() {
  clearInterval(stepTimer);
  ['s1','s2','s3','s4'].forEach(s => {
    const el = document.getElementById(s);
    el.classList.remove('active'); el.classList.add('done');
  });
  setTimeout(() => {
    document.getElementById('progress').classList.remove('visible');
    document.getElementById('generateBtn').disabled = false;
  }, 600);
}

// ── Main generate ──
async function generate() {
  if (!b64Data) return;
  startProgress();

  const subject = document.getElementById('subjectType').value;
  const mood    = document.getElementById('moodTone').value;
  const custom  = document.getElementById('customText').value.trim();
  const extra   = document.getElementById('extraNote').value.trim();

  // Build prompt for Claude
  const systemPrompt = `你是一位日系手繪筆記風版面設計師。
用戶會上傳一張商品照片，你需要分析照片並設計一張「日系手繪筆記風」的 IG 貼文排版（4:5，1080×1350px）。

請以 JSON 格式回傳版面設計資料，格式如下（只回傳 JSON，不要加任何說明）：
{
  "bg_color": "#f7f0e6",
  "photo_position": "center",
  "photo_scale": 0.65,
  "photo_x": 0.5,
  "photo_y": 0.48,
  "handwritten_texts": [
    {"text": "文字內容", "x": 0.5, "y": 0.12, "size": 42, "color": "#3d2b1f", "angle": -2, "align": "center"},
    {"text": "副標題", "x": 0.18, "y": 0.25, "size": 28, "color": "#8b6f47", "angle": -1, "align": "left"}
  ],
  "doodles": [
    {"type": "heart", "x": 0.15, "y": 0.18, "size": 22, "color": "#c4956a", "angle": 0},
    {"type": "star", "x": 0.85, "y": 0.22, "size": 18, "color": "#8b6f47", "angle": 15},
    {"type": "arrow", "x": 0.42, "y": 0.30, "size": 30, "color": "#c4956a", "angle": 10},
    {"type": "cloud_frame", "x": 0.5, "y": 0.85, "size": 160, "color": "#3d2b1f", "angle": 0},
    {"type": "circle_frame", "x": 0.5, "y": 0.48, "size": 200, "color": "#c4956a", "angle": 0},
    {"type": "dots", "x": 0.1, "y": 0.6, "size": 8, "color": "#c4956a", "angle": 0},
    {"type": "wavy_line", "x": 0.5, "y": 0.78, "size": 120, "color": "#8b6f47", "angle": 0}
  ],
  "highlight_boxes": [
    {"x": 0.5, "y": 0.88, "width": 0.45, "height": 0.06, "color": "#c4956a", "text": "重點標示文字", "text_color": "#3d2b1f"}
  ],
  "notebook_lines": true,
  "corner_deco": true
}

所有座標 x/y 為 0~1 的比例值（0.5=中央）。
photo_scale 控制照片佔畫布大小（0.5~0.8），photo_x/y 控制照片中心位置。
handwritten_texts 至少 3 條，要有主標題、副文字、日文小字（平假名/片假名）。
doodles 至少 6 個，散佈在照片周圍，不要遮住主體。
highlight_boxes 1~2 個，框住重要資訊。
整體要有日系手帳感：溫暖、療癒、有質感。`;

  const userPrompt = `請分析這張${subject}照片並生成版面設計。
色調風格：${mood}。
${custom ? `手寫文字請包含：「${custom}」` : '手寫文字請根據照片內容自動生成，要有中文主標題、一句日文小字、幾個英文字母裝飾。'}
${extra ? `額外要求：${extra}` : ''}
回傳 JSON 格式，不需任何說明文字。`;

  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1500,
        system: systemPrompt,
        messages: [{
          role: 'user',
          content: [
            { type: 'image', source: { type: 'base64', media_type: b64Type, data: b64Data } },
            { type: 'text', text: userPrompt }
          ]
        }]
      })
    });

    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error?.message || 'API error');

    const raw = data.content.find(c => c.type === 'text')?.text || '';
    // Extract JSON from response
    const jsonMatch = raw.match(/\{[\s\S]*\}/);
    if (!jsonMatch) throw new Error('未收到有效的版面資料');
    const layout = JSON.parse(jsonMatch[0]);
    lastLayout = layout;

    await renderCard(layout);
    stopProgress();
    document.getElementById('previewWrap').classList.add('visible');
    document.getElementById('previewWrap').scrollIntoView({ behavior: 'smooth', block: 'start' });
    toast('✦ 手繪筆記已生成！');

  } catch (err) {
    stopProgress();
    console.error(err);
    toast('生成失敗：' + err.message);
  }
}

// ── Render card onto canvas ──
async function renderCard(layout) {
  const canvas = document.getElementById('resultCanvas');
  const CW = 1080, CH = 1350;
  canvas.width = CW; canvas.height = CH;
  const ctx = canvas.getContext('2d');

  // ── Background ──
  ctx.fillStyle = layout.bg_color || '#f7f0e6';
  ctx.fillRect(0, 0, CW, CH);

  // Subtle paper texture: horizontal lines
  ctx.save();
  ctx.strokeStyle = 'rgba(139,111,71,0.07)';
  ctx.lineWidth = 0.8;
  for (let y = 60; y < CH; y += 48) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(CW, y); ctx.stroke();
  }
  ctx.restore();

  // Corner decorations
  if (layout.corner_deco !== false) {
    drawCornerDeco(ctx, CW, CH);
  }

  // ── Photo ──
  if (uploadedImage) {
    const px   = (layout.photo_x || 0.5) * CW;
    const py   = (layout.photo_y || 0.48) * CH;
    const scl  = layout.photo_scale || 0.65;
    const imgS = Math.min(CW, CH) * scl;
    const rat  = uploadedImage.width / uploadedImage.height;
    const pw   = rat >= 1 ? imgS : imgS * rat;
    const ph   = rat < 1  ? imgS : imgS / rat;

    ctx.save();
    ctx.translate(px, py);

    // Soft shadow
    ctx.shadowColor = 'rgba(26,20,16,0.15)';
    ctx.shadowBlur  = 28;
    ctx.shadowOffsetX = 4; ctx.shadowOffsetY = 6;

    // Rounded-rect clip
    roundedRect(ctx, -pw/2, -ph/2, pw, ph, 12);
    ctx.clip();
    ctx.shadowColor = 'transparent';
    ctx.drawImage(uploadedImage, -pw/2, -ph/2, pw, ph);
    ctx.restore();

    // Thin border around photo
    ctx.save();
    ctx.translate(px, py);
    ctx.strokeStyle = 'rgba(139,111,71,0.3)';
    ctx.lineWidth = 1.5;
    roundedRect(ctx, -pw/2, -ph/2, pw, ph, 12);
    ctx.stroke();
    ctx.restore();
  }

  // ── Doodles ──
  await document.fonts.ready;
  (layout.doodles || []).forEach(d => {
    drawDoodle(ctx, d, CW, CH);
  });

  // ── Handwritten texts ──
  (layout.handwritten_texts || []).forEach(t => {
    drawText(ctx, t, CW, CH);
  });

  // ── Highlight boxes ──
  (layout.highlight_boxes || []).forEach(h => {
    drawHighlightBox(ctx, h, CW, CH);
  });

  // ── Watermark / stamp ──
  drawStamp(ctx, CW, CH);
}

// ── Drawing helpers ──
function roundedRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y); ctx.arcTo(x+w, y, x+w, y+r, r);
  ctx.lineTo(x+w, y+h-r); ctx.arcTo(x+w, y+h, x+w-r, y+h, r);
  ctx.lineTo(x+r, y+h); ctx.arcTo(x, y+h, x, y+h-r, r);
  ctx.lineTo(x, y+r); ctx.arcTo(x, y, x+r, y, r);
  ctx.closePath();
}

function drawText(ctx, t, CW, CH) {
  const x = t.x * CW, y = t.y * CH;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate((t.angle || 0) * Math.PI / 180);
  ctx.font = `400 ${t.size || 32}px 'Ma Shan Zheng', cursive`;
  ctx.fillStyle = t.color || '#3d2b1f';
  ctx.textAlign = t.align || 'center';
  ctx.globalAlpha = 0.92;
  // Multi-line support
  const lines = String(t.text).split('\n');
  lines.forEach((line, i) => {
    ctx.fillText(line, 0, i * (t.size || 32) * 1.4);
  });
  ctx.restore();
}

function drawDoodle(ctx, d, CW, CH) {
  const x = d.x * CW, y = d.y * CH;
  const sz = d.size || 24;
  const color = d.color || '#c4956a';
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate((d.angle || 0) * Math.PI / 180);
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = Math.max(1.5, sz * 0.06);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.globalAlpha = 0.75;

  switch (d.type) {
    case 'heart':
      ctx.beginPath();
      ctx.moveTo(0, sz*0.3);
      ctx.bezierCurveTo(-sz*0.5,-sz*0.1,-sz*0.7, sz*0.4, 0, sz*0.85);
      ctx.bezierCurveTo( sz*0.7, sz*0.4, sz*0.5,-sz*0.1, 0, sz*0.3);
      ctx.stroke();
      break;
    case 'star':
      for (let i=0;i<5;i++) {
        const a1=i*4*Math.PI/5 - Math.PI/2;
        const a2=(i*4+2)*Math.PI/5 - Math.PI/2;
        i===0 ? ctx.beginPath()&&ctx.moveTo(Math.cos(a1)*sz,Math.sin(a1)*sz) : ctx.lineTo(Math.cos(a1)*sz,Math.sin(a1)*sz);
        ctx.lineTo(Math.cos(a2)*sz*0.4, Math.sin(a2)*sz*0.4);
      }
      ctx.closePath(); ctx.stroke();
      break;
    case 'arrow':
      ctx.beginPath();
      ctx.moveTo(-sz/2, 0); ctx.lineTo(sz/2, 0);
      ctx.moveTo(sz/2-sz*0.25, -sz*0.2); ctx.lineTo(sz/2, 0); ctx.lineTo(sz/2-sz*0.25, sz*0.2);
      ctx.stroke();
      break;
    case 'cloud_frame':
      // Hand-drawn cloud border
      ctx.beginPath();
      const cr = sz * 0.13;
      for (let a=0;a<=Math.PI*2;a+=0.15) {
        const jit = 1 + Math.sin(a*7)*0.04 + Math.cos(a*11)*0.03;
        const rx = Math.cos(a)*(sz/2)*jit, ry = Math.sin(a)*(sz/3)*jit;
        a===0 ? ctx.moveTo(rx,ry) : ctx.lineTo(rx,ry);
      }
      ctx.closePath(); ctx.stroke();
      break;
    case 'circle_frame':
      ctx.beginPath();
      for (let a=0;a<=Math.PI*2;a+=0.08) {
        const jit = 1 + (Math.random()-0.5)*0.025;
        const rx = Math.cos(a)*sz/2*jit, ry = Math.sin(a)*sz/2*jit;
        a===0 ? ctx.moveTo(rx,ry) : ctx.lineTo(rx,ry);
      }
      ctx.closePath(); ctx.stroke();
      break;
    case 'dots':
      for (let i=-2;i<=2;i++) for (let j=-2;j<=2;j++) {
        ctx.beginPath();
        ctx.arc(i*sz*1.2, j*sz*1.2, sz*0.25, 0, Math.PI*2);
        ctx.fill();
      }
      break;
    case 'wavy_line':
      ctx.beginPath();
      ctx.moveTo(-sz/2, 0);
      for (let tx=-sz/2;tx<=sz/2;tx+=4) {
        ctx.lineTo(tx, Math.sin((tx/(sz/8))*Math.PI)*sz*0.08);
      }
      ctx.stroke();
      break;
    case 'asterisk':
      for (let a=0;a<Math.PI;a+=Math.PI/3) {
        ctx.beginPath();
        ctx.moveTo(Math.cos(a)*sz,Math.sin(a)*sz);
        ctx.lineTo(Math.cos(a+Math.PI)*sz,Math.sin(a+Math.PI)*sz);
        ctx.stroke();
      }
      break;
    case 'cross':
      ctx.beginPath();
      ctx.moveTo(-sz/2,0); ctx.lineTo(sz/2,0);
      ctx.moveTo(0,-sz/2); ctx.lineTo(0,sz/2);
      ctx.stroke();
      break;
    default:
      // fallback: small circle
      ctx.beginPath(); ctx.arc(0,0,sz/3,0,Math.PI*2); ctx.stroke();
  }
  ctx.restore();
}

function drawHighlightBox(ctx, h, CW, CH) {
  const cx = h.x * CW, cy = h.y * CH;
  const bw = h.width * CW, bh = h.height * CH;
  ctx.save();
  ctx.translate(cx, cy);
  // Hand-drawn box
  ctx.strokeStyle = h.color || '#c4956a';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.globalAlpha = 0.75;
  ctx.beginPath();
  // Slightly wobbly rectangle
  const hw=bw/2, hh=bh/2, jit=2;
  ctx.moveTo(-hw+jit, -hh);
  ctx.lineTo( hw-jit,  -hh+(Math.random()-0.5)*jit);
  ctx.lineTo( hw,       hh-jit);
  ctx.lineTo(-hw+jit,   hh+(Math.random()-0.5)*jit);
  ctx.closePath();
  ctx.stroke();
  // Text inside box
  if (h.text) {
    ctx.font = `400 ${Math.round(bh*0.55)}px 'Ma Shan Zheng', cursive`;
    ctx.fillStyle = h.text_color || '#3d2b1f';
    ctx.textAlign = 'center';
    ctx.globalAlpha = 0.88;
    ctx.fillText(h.text, 0, bh*0.18);
  }
  ctx.restore();
}

function drawCornerDeco(ctx, CW, CH) {
  const corners = [[32,32,0],[CW-32,32,90],[32,CH-32,-90],[CW-32,CH-32,180]];
  corners.forEach(([x,y,rot]) => {
    ctx.save();
    ctx.translate(x,y); ctx.rotate(rot*Math.PI/180);
    ctx.strokeStyle='rgba(139,111,71,0.35)'; ctx.lineWidth=1.5; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(0,24); ctx.lineTo(0,0); ctx.lineTo(24,0); ctx.stroke();
    ctx.restore();
  });
}

function drawStamp(ctx, CW, CH) {
  ctx.save();
  ctx.translate(CW-52, CH-52);
  ctx.rotate(-0.15);
  ctx.strokeStyle='rgba(139,32,32,0.3)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(0,0,26,0,Math.PI*2); ctx.stroke();
  ctx.font=`700 13px 'Kaisei Decol',serif`; ctx.fillStyle='rgba(139,32,32,0.32)';
  ctx.textAlign='center';
  ctx.fillText('手繪', 0, -4);
  ctx.font=`400 8px 'Noto Serif JP',serif`;
  ctx.fillText('NOTE', 0, 8);
  ctx.restore();
}

// ── Download ──
function downloadAs(fmt) {
  const canvas = document.getElementById('resultCanvas');
  if (!canvas.width) return toast('請先生成圖片');
  const mime = fmt==='jpg' ? 'image/jpeg' : 'image/png';
  const url  = canvas.toDataURL(mime, 0.93);
  const name = `handwritten-note.${fmt}`;
  const a = document.createElement('a');
  a.href=url; a.download=name; a.click();
  toast(`✦ 已下載 ${fmt.toUpperCase()}！`);
}

// ── Toast ──
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}
</script>
